[package]
name = "infinite-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone Rust movement service with bounded binary WebSocket transport"
publish = false

[dependencies]
infinite-core = { path = "../infinite-core" }
infinite-runtime = { path = "../infinite-runtime" }
tokio = { version = "=1.48.0", features = ["rt", "net", "time", "sync", "macros", "fs"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
futures-util = { version = "=0.3.31", default-features = false, features = ["std", "sink", "async-await"] }
infinite-protocol = { path = "../infinite-protocol" }
